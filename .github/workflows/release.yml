name: Verify Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Run tests
        run: swift test
      - name: Build universal release packages
        run: sh scripts/build-dmg.sh 2.0.0
      - name: Verify packages
        run: |
          codesign --verify --deep --strict VolumeControl.app
          hdiutil verify dist/VolumeControl-2.0.0-universal.dmg
          cd dist
          shasum -a 256 -c SHA256SUMS.txt
      # 发布由 gh release create 显式完成，CI 不覆盖已经验收的下载资产。
      - uses: actions/upload-artifact@v4
        with:
          name: VolumeControl-universal-release
          path: dist/*
          if-no-files-found: error
